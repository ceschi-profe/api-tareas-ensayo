# Demo del detonador del Tema 6 (solo docente). Requiere el secreto DEMO_TOKEN en el repositorio
# de demostración, con un valor falso (por ejemplo tok_demo_0000). El archivo va en main del
# repositorio de demostración (workflow_dispatch solo aparece si el workflow está en la rama por
# defecto) y se lanza a mano desde Actions, Run workflow.
name: Demo - secreto en el log

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir el secreto tal cual (GitHub lo redacta)
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: echo "El token es $TOKEN"

      - name: Imprimir el secreto transformado (la redacción no lo reconoce)
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: echo "El token en base64 es $(echo -n "$TOKEN" | base64)"
